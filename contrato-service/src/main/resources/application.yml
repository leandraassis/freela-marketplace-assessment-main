server:
  port: 8081
spring:
  application:
    name: contrato-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrato_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
app:
  kafka:
    topics:
      contratos: contratos.eventos.v1
      contratos-dlt: contratos.eventos.v1.DLT
      particoes: 3
  outbox:
    intervalo-ms: 500
    lote: 50
    timeout-envio-ms: 15000
    chave-lock: 1001
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} - %msg%n"
  level:
    root: INFO
    br.com.freela: INFO
    org.hibernate.SQL: INFO
    org.springframework.kafka.support.LoggingProducerListener: OFF
